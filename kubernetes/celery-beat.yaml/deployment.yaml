apiVersion: apps/v1
kind: Deployment

metadata:
  name: celery-beat
  namespace: storage-manager

spec:
  replicas: 1

  selector:
    matchLabels:
      app: celery-beat

  template:
    metadata:
      labels:
        app: celery-beat

    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: celery-beat
          image: localhost:5000/storage-manager:latest
          imagePullPolicy: IfNotPresent

          command:
            - celery
            - -A
            - config
            - beat
            - --loglevel=info

          envFrom:
            
            - configMapRef:
                name: django-config

            - secretRef:
                name: django-secret

          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL