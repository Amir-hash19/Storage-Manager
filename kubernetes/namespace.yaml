apiVersion: v1
kind: Namespace
metadata:
  name: storage-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: storage-manager-quota
  namespace: storage-manager
spec:
  hard:
    requests.cpu: "4"
    limits.cpu: "6"

    requests.memory: "5Gi"
    limits.memory: "7Gi"

    requests.storage: "10Gi"

    persistentvolumeclaims: "5"
    pods: "10"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: storage-manager-limit-range
  namespace: storage-manager
spec:
  limits:
    - type: Container

      min:
        cpu: "500"
        memory: "512Mi"

      max:
        cpu: "1"
        memory: "4Gi"

      defaultRequest:
        cpu: "300m"
        memory: "256Mi"

      default:
        cpu: "500m"
        memory: "512Mi"