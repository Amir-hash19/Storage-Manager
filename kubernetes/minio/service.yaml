apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: storage-manager

spec:
  type: NodePort

  selector:
    app: minio

  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP

    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30091
      protocol: TCP